<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="???">
  <meta name="author" content="John Mahoney">
  <meta name="keywords" content="html, css, ???">
  <link rel="stylesheet" href="./pages/index.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Document</title>
</head>
<body>
  <div class="page">
  <header class="header">
  <img src="./images/Logo.svg" alt="Spot Logo" class="header__logo">
  </header>
  <main class="content">
  <section class="profile page__section">
    <img src="./images/avatar.jpg" alt="Bessie Coleman" class="profile__avatar"/>
    <div class="profile__column">
      <h1 class="profile__name">Bessie Coleman</h1>
      <p class="profile__description">Civil Aviator</p>
 <button type="button" class="profile__edit-btn">
      <img src="./images/pencil.svg" alt="Pencil icon"/>Edit Profile
    </button>
    </div>
   <button type="button" class="profile__new-post-btn">
      <img src="./images/plus.svg" alt="Plus icon"/>New Post
    </button>
  </section>
  <section class="cards page__section">
    <ul class="cards__list">
    <li class="card">
      <img src="./images/1-photo-by-moritz-feldmann-from-pexels.jpg" alt="val Throrens" class="card__image">
    <div class="card__content">
      <h2 class="card__title">Val Throrens</h2>
      <button type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
      <li class="card">
      <img src="./images/2-photo-by-ceiline-from-pexels.jpg" alt="ceiline" class="card__image">
    <div class="card__content">
      <h2 class="card__title">ceiline</h2>
      <button  type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
      <li class="card">
      <img src="./images/3-photo-by-tubanur-dogan-from-pexels.jpg" alt="tubanur dogan" class="card__image">
    <div class="card__content">
      <h2 class="card__title">tubanur dogan</h2>
      <button  type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
      <li class="card">
      <img src="./images/4-photo-by-maurice-laschet-from-pexels.jpg" alt="maurice laschet" class="card__image">
    <div class="card__content">
      <h2 class="card__title">maurice laschet</h2>
      <button  type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
      <li class="card">
      <img src="./images/5-photo-by-van-anh-nguyen-from-pexels.jpg" alt="van anh nguyen" class="card__image">
    <div class="card__content">
      <h2 class="card__title">van anh nguyen</h2>
      <button  type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
      <li class="card">
      <img src="./images/6-photo-by-moritz-feldmann-from-pexels.jpg" alt="moritz feldmann" class="card__image">
    <div class="card__content">
      <h2 class="card__title">moritz feldmann</h2>
      <button  type="button" class="card__like-button">
      <img src="./images/heart.svg" alt="heart">
      </button>
    </div>
    </li>
  </ul>
  </section>
  </main>
  </div>
   <footer class="footer">
    <p class="footer__copyright">&copy; 2024 Spot</p>
  <div class="modal" id="edit-profile-modal">
  <div class="modal__container">
    <button type="button" class="modal__close-btn" aria-label="Close modal">
      <img src="./images/close-icon.svg" alt="x-icon" class="close-icon">
    </button>
    <h2 class="modal__title">Edit Profile</h2>
    <form class="modal__form">
      <label for="profile-name-input" class="modal__label">
        Name
        <input id="profile-name-input" type="text" class="modal__input"
               placeholder="John Mahoney"/>
      </label>
      <label for="profile-description-input" class="modal__label">
        Description
        <input id="profile-description-input" type="text" class="modal__input"
               placeholder="Software Developer"/>
      </label>
      <button type="submit" class="modal__submit-btn">Save</button>
    </form>
  </div>
</div>
<div class="modal" id="new-post-modal">
  <div class="modal__container">
    <button type="button" class="modal__close-btn" aria-label="Close modal">X</button>
    <h2 class="modal__title">New Post</h2>
    <form class="modal__form">
      <label for="post-title-input" class="modal__label">
        Title
        <input id="post-title-input" type="text" class="modal__input"
               placeholder="Post title"/>
      </label>
      <label for="post-image-input" class="modal__label">
        Image URL
        <input id="post-image-input" type="url" class="modal__input"
               placeholder="Place a link to the picture"/>
      </label>
      <button type="submit" class="modal__submit-btn">Save</button>
    </form>
  </div>
</div>
  </footer>
<script src="./scripts/index.js" defer></script>
</body>
</html>
